function lsGet(key,def){try{const v=localStorage.getItem(key);return v!==null?JSON.parse(v):def;}catch{return def;}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}}

function useLS(key,init){
  const[v,sv]=useState(()=>lsGet(key,init));
  const set=useCallback(val=>{
    const newVal=typeof val==="function"?val(lsGet(key,init)):val;
    sv(newVal);lsSet(key,newVal);
  },[key]);
  return[v,set];
}

function useYandexReady(){
  const[ready,setReady]=useState(()=>!!(window.ymaps&&window.ymaps.Map));
  useEffect(()=>{
    let alive=true;
    const wait=()=>{
      if(window.ymaps&&window.ymaps.ready){
        window.ymaps.ready(()=>alive&&setReady(true));
      }else setTimeout(wait,150);
    };
    wait();
    return()=>{alive=false;};
  },[]);
  return ready;
}

}

/* ══ DELIVERY MAP (SVG-based Almaty map) ══ */
function DeliveryMap({selectedPin,onSelectPin}){
  const{dark}=useApp();const T=getT(dark);
  const ready=useYandexReady();
  const mapRef=useRef(null),mapObj=useRef(null),marksRef=useRef([]);

  useEffect(()=>{
    if(!ready||!mapRef.current||mapObj.current)return;
    const ym=window.ymaps;
    const map=new ym.Map(mapRef.current,{center:[43.2389,76.8897],zoom:12,controls:["zoomControl","geolocationControl","fullscreenControl"]});
    mapObj.current=map;
    marksRef.current=ALMATY_PINS.map((pin,i)=>{
      const mark=new ym.Placemark([pin.lat,pin.lng],{hintContent:pin.name,balloonContent:`<strong>${pin.name}</strong><br/>${pin.addr}`},{preset:"islands#orangeDotIcon"});
      mark.events.add("click",()=>onSelectPin(i));
      map.geoObjects.add(mark);
      return mark;
    });
    return()=>{map.destroy();mapObj.current=null;marksRef.current=[];};
  },[ready,onSelectPin]);

  useEffect(()=>{
    if(!mapObj.current||selectedPin===null)return;
    const ym=window.ymaps;
    const pin=ALMATY_PINS[selectedPin];
    mapObj.current.setCenter([pin.lat,pin.lng],15,{duration:250});
    marksRef.current.forEach((mark,i)=>mark.options.set("preset",i===selectedPin?"islands#redIcon":"islands#orangeDotIcon"));
    marksRef.current[selectedPin]?.balloon.open();
  },[selectedPin]);

  if(!ready)return <MapFallback/>;
  return <div style={{position:"relative",borderRadius:14,overflow:"hidden",border:`1px solid ${T.border}`,background:T.cardHover}}>
    <div ref={mapRef} style={{height:300,width:"100%"}}/>
    <div style={{padding:"0.55rem 0.7rem",borderTop:`1px solid ${T.border}`,fontSize:12,color:T.muted,background:T.card}}>
      📍 {selectedPin!==null?ALMATY_PINS[selectedPin].addr:"Картадан нүкте таңдаңыз"}
    </div>
  </div>;
}
/* ══ COURIER MAP ══ */
function CourierMap({status}){
  const{dark}=useApp();const T=getT(dark);
  const ready=useYandexReady();
  const mapRef=useRef(null),mapObj=useRef(null),courierRef=useRef(null),routeRef=useRef(null),timerRef=useRef(null);
  const progress=status==="arrived"?1:status==="pickup"?.68:status==="ready"?.36:status==="preparing"?.16:.04;

  useEffect(()=>{
    if(!ready||!mapRef.current||mapObj.current)return;
    const ym=window.ymaps;
    const map=new ym.Map(mapRef.current,{center:[43.229,76.884],zoom:12,controls:["zoomControl","fullscreenControl"]});
    mapObj.current=map;
    routeRef.current=new ym.Polyline(YANDEX_ROUTE,{}, {strokeColor:T.accent,strokeWidth:4,strokeOpacity:.85});
    map.geoObjects.add(routeRef.current);
    map.geoObjects.add(new ym.Placemark(YANDEX_ROUTE[0],{hintContent:"Мейрамхана"},{preset:"islands#greenFoodIcon"}));
    map.geoObjects.add(new ym.Placemark(YANDEX_ROUTE[YANDEX_ROUTE.length-1],{hintContent:"Клиент"},{preset:"islands#blueHomeIcon"}));
    courierRef.current=new ym.Placemark(YANDEX_ROUTE[0],{hintContent:"Курьер"},{preset:"islands#orangeCircleDotIcon"});
    map.geoObjects.add(courierRef.current);
    map.setBounds(map.geoObjects.getBounds(),{checkZoomRange:true,zoomMargin:30});
    return()=>{clearInterval(timerRef.current);map.destroy();mapObj.current=null;courierRef.current=null;routeRef.current=null;};
  },[ready,dark]);

  useEffect(()=>{
    if(!courierRef.current)return;
    const lerp=(a,b,t)=>a+(b-a)*t;
    const pointAt=t=>{
      const max=YANDEX_ROUTE.length-1;
      const i=Math.min(Math.floor(t*max),max-1);
      const local=t*max-i;
      const a=YANDEX_ROUTE[i],b=YANDEX_ROUTE[i+1];
      return [lerp(a[0],b[0],local),lerp(a[1],b[1],local)];
    };
    let current=0;
    clearInterval(timerRef.current);
    timerRef.current=setInterval(()=>{
      current+=(progress-current)*.12;
      courierRef.current.geometry.setCoordinates(pointAt(current));
    },120);
    return()=>clearInterval(timerRef.current);
  },[progress]);

  if(!ready)return <MapFallback/>;
  return <div style={{position:"relative",height:300,borderRadius:14,overflow:"hidden",background:T.cardHover}}>
    <div ref={mapRef} style={{height:"100%",width:"100%"}}/>
    <div style={{position:"absolute",left:12,bottom:12,background:T.card,color:T.text,border:`1px solid ${T.border}`,borderRadius:10,padding:"6px 10px",fontSize:12,boxShadow:"0 8px 24px rgba(0,0,0,.18)"}}>🛵 Курьер жолда</div>
  </div>;
}

      <span style={{fontSize:10,opacity:0.6,display:"inline-block",transform:open?"rotate(180deg)":"none",transition:"transform 0.2s"}}>▼</span>
    </button>
    {open&&<div className="drop-down" style={{
      position:"absolute",top:"calc(100% + 8px)",right:0,minWidth:200,
      background:T.card,border:`1px solid ${T.border}`,borderRadius:14,
      boxShadow:`0 8px 32px rgba(0,0,0,0.18)`,zIndex:500,overflow:"hidden",padding:"6px"
    }}>
      <div style={{padding:"8px 12px 6px",borderBottom:`1px solid ${T.border}`,marginBottom:4}}>

      {items.map((item,i)=><button key={i} onClick={item.action} style={{

        textAlign:"left",transition:"background 0.15s"

        onMouseLeave={e=>e.currentTarget.style.background="transparent"}
      >
        <span style={{fontSize:15,width:20,textAlign:"center"}}>{item.icon}</span>

      </button>)}
    </div>}
  </div>;
}

/* ══ AUTH PAGE ══ */
function AuthPage({nav,onLogin,initMode="login"}){
  const{dark,L}=useApp();const T=getT(dark);
  const[isLogin,sIL]=useState(initMode==="login");
  const[name,sName]=useState(""),[email,sEmail]=useState(""),
        [phone,sPhone]=useState(""),[pass,sPass]=useState(""),
        [err,sErr]=useState("");
  const ff="'Syne',sans-serif";
  const doLogin=()=>{
    sErr("");
    const users=lsGet("ffg_users",[]);
    const u=users.find(u=>u.email===email&&u.pass===pass);
    if(u){onLogin(u);nav("home");}else sErr(L.wrongCred);
  };
  const doReg=()=>{
    sErr("");
    if(!name||!email||!pass||!phone){sErr(L.regRequired);return;}
    const users=lsGet("ffg_users",[]);
    if(users.find(u=>u.email===email)){sErr(L.regExists);return;}
    const nu={id:Date.now(),name,email,phone,pass,isAdmin:false,orders:[],addresses:[],favorites:[]};
    lsSet("ffg_users",[...users,nu]);
    onLogin(nu);nav("home");
  };
  return <div style={{minHeight:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}>
    <div style={{width:"100%",maxWidth:400}} className="fade-in">
      <div style={{textAlign:"center",marginBottom:"1.5rem"}}>
        <div style={{fontSize:36}}>⚡</div>
        <h1 style={{fontFamily:ff,fontWeight:900,fontSize:26,background:`linear-gradient(135deg,${T.accent},#ff6b35)`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",margin:"4px 0"}}>{L.app}</h1>
      </div>
      <Crd style={{padding:"1.75rem"}}>
        <div style={{display:"flex",gap:8,marginBottom:"1.25rem"}}>
          {[[true,L.loginBtn],[false,L.regBtn]].map(([il,lb])=>
            <button key={String(il)} onClick={()=>sIL(il)} style={{flex:1,padding:"9px",borderRadius:9,border:`1px solid ${isLogin===il?T.accent:T.border}`,background:isLogin===il?T.accent+"22":"transparent",color:isLogin===il?T.accent:T.muted,fontWeight:600,cursor:"pointer",fontSize:13,transition:"all 0.18s"}}>{lb}</button>
          )}
        </div>
        <div style={{display:"grid",gap:"0.6rem"}}>
          {!isLogin&&<Inp placeholder={L.name} value={name} onChange={e=>sName(e.target.value)}/>}
          <Inp placeholder={L.email} value={email} onChange={e=>sEmail(e.target.value)} type="email"/>
          {!isLogin&&<Inp placeholder={L.phone} value={phone} onChange={e=>sPhone(e.target.value)}/>}
          <Inp placeholder={L.pass} value={pass} onChange={e=>sPass(e.target.value)} type="password" onKeyDown={e=>e.key==="Enter"&&(isLogin?doLogin():doReg())}/>
          {err&&<div style={{color:T.red,fontSize:13,padding:"8px 12px",background:T.red+"11",borderRadius:8}}>{err}</div>}
          <Btn full sz="lg" onClick={isLogin?doLogin:doReg}>{isLogin?L.loginBtn:L.regBtn}</Btn>
        </div>
        <p style={{textAlign:"center",marginTop:"0.9rem",fontSize:13,color:T.muted}}>
          {isLogin?L.noAcc:L.hasAcc}{" "}
          <span onClick={()=>sIL(l=>!l)} style={{color:T.accent,cursor:"pointer",fontWeight:600}}>{isLogin?L.regBtn:L.loginBtn}</span>
        </p>
        <div style={{borderTop:`1px solid ${T.border}`,marginTop:"1.1rem",paddingTop:"0.9rem",textAlign:"center"}}>
          <span onClick={()=>nav("admin-login")} style={{color:T.muted,fontSize:12,cursor:"pointer",textDecoration:"underline"}}>⚙️ {L.admin}</span>
        </div>
      </Crd>
      <div style={{textAlign:"center",marginTop:"0.8rem"}}><Btn v="ghost" onClick={()=>nav("home")}>← {L.home}</Btn></div>
    </div>
  </div>;
}

/* ══ HOME ══ */
function HomePage({nav,cart,user,restaurants,doLogout}){
  const{dark,L}=useApp();const T=getT(dark);
  const[search,sSearch]=useState(""),
        [cat,sCat]=useState("all");
  const ff="'Syne',sans-serif";
  const cartCount=Object.keys(cart).filter(k=>k!=="_items").reduce((a,k)=>a+cart[k],0);
  const filtered=restaurants.filter(r=>(cat==="all"||r.cat===cat)&&r.name.toLowerCase().includes(search.toLowerCase()));

  const toggleFav=useCallback((e,rId)=>{
    e.stopPropagation();
    if(!user||user.isAdmin)return;
    const currentUser=lsGet("ffg_user",null);
    if(!currentUser)return;
    const favs=currentUser.favorites||[];
    const next=favs.includes(rId)?favs.filter(f=>f!==rId):[...favs,rId];
    const updated={...currentUser,favorites:next};
    lsSet("ffg_user",updated);
    const users=lsGet("ffg_users",[]);
    lsSet("ffg_users",users.map(u=>u.id===updated.id?updated:u));
    window.dispatchEvent(new CustomEvent("ffg_fav_update"));
  },[user]);

  const[favIds,setFavIds]=useState(()=>{const u=lsGet("ffg_user",null);return u?u.favorites||[]:[];});
  useEffect(()=>{
    const handler=()=>{const u=lsGet("ffg_user",null);setFavIds(u?u.favorites||[]:[]); };
    window.addEventListener("ffg_fav_update",handler);
    return()=>window.removeEventListener("ffg_fav_update",handler);
  },[]);
  useEffect(()=>{const u=lsGet("ffg_user",null);setFavIds(u?u.favorites||[]:[]); },[user]);

  return <div style={{minHeight:"100vh",background:T.bg,color:T.text}}>
    <Navbar nav={nav} cartCount={cartCount} user={user} doLogout={doLogout}/>
    <div style={{maxWidth:1200,margin:"0 auto",padding:"2rem 1rem 4rem"}} className="fade-in">
      <div style={{textAlign:"center",marginBottom:"2rem"}}>
        <div style={{display:"inline-block",background:T.glow,border:`1px solid ${T.accent}44`,borderRadius:30,padding:"4px 14px",fontSize:12,color:T.accent,marginBottom:"0.7rem"}}>🚀 20–40 {L.min}</div>
        <h1 style={{fontSize:"clamp(1.7rem,5vw,3rem)",fontWeight:900,margin:"0 0 0.6rem",lineHeight:1.1,fontFamily:ff}}>
          {L.app}<br/><span style={{background:`linear-gradient(135deg,${T.accent},#ff6b35)`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{L.tagline}</span>
        </h1>
        <p style={{color:T.muted,fontSize:15,marginBottom:"1.25rem"}}>{L.sub}</p>
        <Inp placeholder={"🔍  "+L.searchP} value={search} onChange={e=>sSearch(e.target.value)} style={{maxWidth:500,margin:"0 auto",display:"block"}}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"0.7rem",maxWidth:460,margin:"0 auto 1.75rem"}}>
        {[["200+",L.restaurantsT],["4.8★","Rating"],["30 "+L.min,"~"]].map(([v,l])=>
          <div key={l} style={{textAlign:"center",background:T.glass,border:`1px solid ${T.border}`,borderRadius:13,padding:"0.85rem"}}>
            <div style={{fontSize:16,fontWeight:800,color:T.accent,fontFamily:ff}}>{v}</div>
            <div style={{fontSize:11,color:T.muted}}>{l}</div>
          </div>
        )}
      </div>
      <div style={{background:`linear-gradient(135deg,${T.accentD},${T.accent},#ff6b35)`,borderRadius:18,padding:"1.4rem 1.8rem",marginBottom:"1.75rem",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"0.7rem"}}>
        <div>
          <div style={{fontSize:20,fontWeight:900,color:"#fff",fontFamily:ff}}>{L.promoBanner}</div>
          <div style={{fontSize:13,color:"rgba(255,255,255,0.85)",marginTop:3}}>{L.promoCode}</div>
        </div>
        <div style={{fontSize:44}}>🎉</div>
      </div>
      <div style={{display:"flex",gap:"0.45rem",overflowX:"auto",marginBottom:"1.4rem",paddingBottom:4,scrollbarWidth:"none"}}>
        {CATS.map(c=><button key={c} onClick={()=>sCat(c)} style={{background:cat===c?T.accent:T.card,color:cat===c?"#fff":T.muted,border:`1px solid ${cat===c?T.accent:T.border}`,borderRadius:28,padding:"7px 15px",fontSize:13,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap",transition:"all 0.18s",outline:"none",flexShrink:0}}>{L[CAT_KEYS[c]]}</button>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(270px,1fr))",gap:"1rem"}}>
        {filtered.map(r=>(
          <Crd key={r.id} onClick={()=>nav("restaurant",r)} style={{overflow:"hidden",padding:0}}>
            <div style={{height:145,position:"relative",overflow:"hidden"}}>
              <img src={r.img||"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&q=80"} alt={r.name}
                style={{width:"100%",height:"100%",objectFit:"cover",display:"block",transition:"transform 0.4s"}}
                onMouseEnter={e=>e.currentTarget.style.transform="scale(1.06)"}
                onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}
                onError={e=>{e.target.src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&q=80";}}/>
              <div style={{position:"absolute",inset:0,background:"linear-gradient(to top,rgba(0,0,0,0.5),transparent 55%)"}}/>
              {r.disc&&<div style={{position:"absolute",top:9,right:9,background:T.red,color:"#fff",borderRadius:7,padding:"3px 8px",fontSize:11,fontWeight:700}}>−{r.disc}</div>}
              {user&&!user.isAdmin&&<button onClick={e=>toggleFav(e,r.id)} style={{position:"absolute",top:9,left:9,background:"rgba(0,0,0,0.45)",border:"none",borderRadius:7,padding:"4px 8px",fontSize:16,cursor:"pointer",color:"#fff"}}
                onMouseEnter={e=>e.currentTarget.style.transform="scale(1.2)"}
                onMouseLeave={e=>e.currentTarget.style.transform="scale(1)"}
              >{favIds.includes(r.id)?"❤️":"🤍"}</button>}
              <div style={{position:"absolute",bottom:7,left:9,fontSize:22}}>{r.emoji||"🍽️"}</div>
            </div>
            <div style={{padding:"0.85rem 1rem"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
                <div style={{fontWeight:800,fontSize:15,fontFamily:ff,color:T.text}}>{r.name}</div>
                <span style={{color:T.accent,fontWeight:700,fontSize:13}}>★ {r.rating}</span>
              </div>
              <div style={{display:"flex",gap:9,fontSize:12,color:T.muted,marginBottom:7,flexWrap:"wrap"}}>
                <span>⏱ {r.time} {L.min}</span>
                <span>🚚 {r.free?L.free:`${r.fee}₸`}</span>
              </div>
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {(r.tags||[]).slice(0,2).map(t=><Bdg key={t}>{t}</Bdg>)}
              </div>
            </div>
          </Crd>
        ))}
      </div>
    </div>
  </div>;
}

/* ══ RESTAURANT ══ */
function RestaurantPage({restaurant,nav,cart,setCart,addToast,user,updateUser}){
  const{dark,L}=useApp();const T=getT(dark);
  const menu=MENU[restaurant.id]||[];
  const[search,sSearch]=useState("");
  const ff="'Syne',sans-serif";
  const cartCount=Object.keys(cart).filter(k=>k!=="_items").reduce((a,k)=>a+cart[k],0);

  const[isFav,setIsFav]=useState(()=>{
    const u=lsGet("ffg_user",null);
    return u&&!u.isAdmin?(u.favorites||[]).includes(restaurant.id):false;
  });

  const toggleFav=()=>{
    if(!user||user.isAdmin)return;
    const currentUser=lsGet("ffg_user",null);
    if(!currentUser)return;
    const favs=currentUser.favorites||[];
    const next=favs.includes(restaurant.id)?favs.filter(f=>f!==restaurant.id):[...favs,restaurant.id];
    const updated={...currentUser,favorites:next};
    if(updateUser)updateUser(updated);
    setIsFav(next.includes(restaurant.id));
    addToast(next.includes(restaurant.id)?"❤️ Таңдаулыға қосылды":"💔 Таңдаулыдан өшірілді");
  };

  const addToCart=item=>{
    setCart(prev=>{
      const updated={...prev,[item.id]:(prev[item.id]||0)+1,_items:{...(prev._items||{}),[item.id]:item}};
      lsSet("ffg_cart",updated);return updated;
    });
    addToast("🛒 "+item.name);
  };
  const filtered=menu.filter(i=>i.name.toLowerCase().includes(search.toLowerCase()));

  return <div style={{minHeight:"100vh",background:T.bg,color:T.text}}>
    <nav style={{position:"sticky",top:0,zIndex:100,background:T.nav,backdropFilter:"blur(20px)",borderBottom:`1px solid ${T.border}`,padding:"0 1rem"}}>
      <div style={{maxWidth:1200,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:56}}>
        <Btn v="ghost" onClick={()=>nav("home")}>{L.back}</Btn>
        <div style={{display:"flex",gap:8}}>
          {user&&!user.isAdmin&&<button onClick={toggleFav} style={{background:"transparent",border:`1px solid ${T.border}`,borderRadius:9,padding:"7px 11px",fontSize:16,cursor:"pointer"}}>{isFav?"❤️":"🤍"}</button>}
          <Btn sz="sm" onClick={()=>nav("cart")}>🛒{cartCount>0&&` (${cartCount})`}</Btn>
        </div>
      </div>
    </nav>
    <div style={{maxWidth:860,margin:"0 auto",padding:"0 1rem 3rem"}} className="fade-in">
      <div style={{height:200,borderRadius:18,overflow:"hidden",position:"relative",margin:"1rem 0"}}>
        <img src={restaurant.img} alt={restaurant.name} style={{width:"100%",height:"100%",objectFit:"cover"}}
          onError={e=>{e.target.src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&q=80";}}/>
        <div style={{position:"absolute",inset:0,background:"linear-gradient(to top,rgba(10,10,15,0.85),transparent 55%)"}}/>
        <div style={{position:"absolute",bottom:14,left:18}}>
          <h1 style={{fontSize:26,fontWeight:900,color:"#fff",fontFamily:ff,margin:"0 0 5px"}}>{restaurant.name}</h1>
          <div style={{display:"flex",gap:12,fontSize:13,color:"rgba(255,255,255,0.8)",flexWrap:"wrap"}}>
            <span>★ {restaurant.rating}</span><span>⏱ {restaurant.time} {L.min}</span><span>🚚 {restaurant.free?L.free:`${restaurant.fee}₸`}</span>
          </div>
        </div>
      </div>
      <Inp placeholder={"🔍 "+L.searchP} value={search} onChange={e=>sSearch(e.target.value)} style={{marginBottom:"1rem"}}/>

/* ══ CART ══ */
function CartPage({nav,cart,setCart,user,updateUser,addOrderToUser}){
  const{dark,L}=useApp();const T=getT(dark);
  const[promo,sPromo]=useState(""),
        [promoOk,sPOk]=useState(false),
        [addr,sAddr]=useState((user&&!user.isAdmin&&user.addresses&&user.addresses[0])||""),
        [pay,sPay]=useState("card"),
        [err,sErr]=useState(""),
        [selectedPin,setSelectedPin]=useState(null),
        [showMap,setShowMap]=useState(false);
  const ff="'Syne',sans-serif";
  const items=Object.keys(cart).filter(k=>k!=="_items").map(k=>({...(cart._items?.[k]||{id:k,name:"Блюдо",price:1000}),qty:cart[k]})).filter(i=>i.qty>0);
  const sub=items.reduce((a,i)=>a+i.price*i.qty,0);
  const del=sub>=5000?0:499;
  const disc=promoOk?Math.round(sub*.2):0;
  const total=sub+del-disc;

  const updQ=(id,d)=>setCart(prev=>{
    const nv=Math.max(0,(prev[id]||0)+d);
    let n;
    if(nv===0){n={...prev};delete n[id];if(n._items)delete n._items[id];}
    else n={...prev,[id]:nv};
    lsSet("ffg_cart",n);return n;
  });

  const selectMapPin=(i)=>{
    setSelectedPin(i);
    sAddr(ALMATY_PINS[i].addr);
    setShowMap(false);
  };

  const doCheckout=()=>{
    sErr("");
    if(!addr.trim()){sErr(L.addrRequired||"Мекенжайды енгізіңіз");return;}
    const now=new Date();
    const timeStr=now.toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"});
    const dateStr=now.toLocaleDateString("ru");
    const orderId=`FF-${Math.floor(Math.random()*9000)+1000}`;
    const clientName=user&&!user.isAdmin?user.name:"Гость";
    const firstItemId=items[0]?.id;
    let restName="—";
    for(const[rid,menuItems] of Object.entries(MENU)){
      if(menuItems.find(m=>m.id===firstItemId)){
        const r=lsGet("ffg_restaurants",INIT_RESTAURANTS).find(r=>r.id===parseInt(rid));
        if(r)restName=r.name;break;
      }
    }
    const newOrder={
      id:orderId,client:clientName,restaurant:restName,
      items:items.map(i=>`${i.name} × ${i.qty}`).join(", "),
      itemsList:items.map(i=>({name:i.name,qty:i.qty,price:i.price})),
      total,totalStr:total.toLocaleString()+"₸",
      status:"🟢 Жеткізілді",time:timeStr,date:dateStr,address:addr,payment:pay
    };
    const globalOrders=lsGet(ORDERS_KEY,[]);
    lsSet(ORDERS_KEY,[newOrder,...globalOrders].slice(0,50));
    if(user&&!user.isAdmin){
      const userOrder={id:orderId,date:dateStr,items:newOrder.items,total,status:"✅"};
      addOrderToUser(userOrder);
      const couriers=lsGet(COURIERS_KEY,INIT_COURIERS);
      if(couriers.length>0){
        const idx=Math.floor(Math.random()*Math.min(2,couriers.length));
        couriers[idx]={...couriers[idx],del:couriers[idx].del+1,earn:couriers[idx].earn+Math.round(total*0.08)};
        lsSet(COURIERS_KEY,couriers);
      }
    }
    setCart({});lsSet("ffg_cart",{});
    nav("tracking");
  };

  return <div style={{minHeight:"100vh",background:T.bg,color:T.text}}>
    <nav style={{position:"sticky",top:0,zIndex:100,background:T.nav,backdropFilter:"blur(20px)",borderBottom:`1px solid ${T.border}`,padding:"0 1rem"}}>
      <div style={{maxWidth:1200,margin:"0 auto",display:"flex",alignItems:"center",height:56,gap:10}}>
        <Btn v="ghost" onClick={()=>nav("home")}>{L.back}</Btn>
        <h2 style={{margin:0,fontSize:17,fontWeight:800,fontFamily:ff}}>🛒 {L.cart}</h2>
      </div>
    </nav>
    <div style={{maxWidth:860,margin:"0 auto",padding:"1.25rem 1rem 3rem"}} className="fade-in">
      {items.length===0?<Crd style={{textAlign:"center",padding:"3rem 2rem",marginTop:"2rem"}}>
        <div style={{fontSize:52}}>🛒</div>
        <h3 style={{fontFamily:ff,margin:"1rem 0",color:T.text}}>{L.emptyCart}</h3>
        <Btn onClick={()=>nav("home")}>{L.goMenu}</Btn>
      </Crd>:<div style={{display:"grid",gap:"1.1rem"}}>
        <div style={{display:"grid",gap:"0.55rem"}}>
          {items.map(item=><Crd key={item.id} style={{display:"flex",alignItems:"center",gap:"0.75rem",padding:0,overflow:"hidden"}}>
            <div style={{width:68,height:68,flexShrink:0,position:"relative"}}>
              {item.img?<img src={item.img} alt={item.name} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}
                onError={e=>{e.target.style.display="none";}}/>
              :<div style={{width:"100%",height:"100%",background:T.cardHover,display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>🍽️</div>}
            </div>
            <div style={{flex:1,padding:"0.55rem 0",minWidth:0}}>
              <div style={{fontWeight:700,fontSize:14,color:T.text}}>{item.name}</div>
              <div style={{color:T.accent,fontWeight:700,marginTop:2,fontSize:13}}>{(item.price*item.qty).toLocaleString()}₸</div>
              <div style={{fontSize:11,color:T.muted}}>{item.price.toLocaleString()}₸ × {item.qty}</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:6,padding:"0 0.8rem",flexShrink:0}}>
              <button onClick={()=>updQ(item.id,-1)} style={{width:28,height:28,borderRadius:7,background:T.cardHover,border:`1px solid ${T.border}`,color:T.text,cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
              <span style={{fontWeight:700,minWidth:18,textAlign:"center",color:T.text,fontSize:14}}>{item.qty}</span>
              <button onClick={()=>updQ(item.id,1)} style={{width:28,height:28,borderRadius:7,background:T.accent,border:"none",color:"#fff",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
            </div>
          </Crd>)}
        </div>

        {del>0&&<div style={{background:T.glow,border:`1px solid ${T.accent}44`,borderRadius:11,padding:"9px 13px",fontSize:13,color:T.accent}}>
          💡 {L.freeHint}
        </div>}

        {/* Address with map */}
        <Crd>
          <h4 style={{fontWeight:700,marginBottom:"0.6rem",fontFamily:ff,color:T.text}}>📍 {L.address}</h4>
          <p style={{fontSize:12,color:T.muted,marginBottom:"0.6rem"}}>{L.mapHint}</p>
          <Btn v="ghost" full sz="sm" onClick={()=>setShowMap(s=>!s)} style={{marginBottom:"0.7rem"}}>
            🗺️ {showMap?"Картаны жабу":"Картадан таңдау"}
          </Btn>
          {showMap&&<div style={{marginBottom:"0.75rem"}}>
            <DeliveryMap selectedPin={selectedPin} onSelectPin={selectMapPin}/>
            <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:"0.5rem"}}>
              {ALMATY_PINS.map((p,i)=><button key={i} onClick={()=>selectMapPin(i)} style={{
                background:selectedPin===i?T.accent+"22":"transparent",
                border:`1px solid ${selectedPin===i?T.accent:T.border}`,
                borderRadius:8,padding:"5px 9px",fontSize:11,color:selectedPin===i?T.accent:T.muted,cursor:"pointer"
              }}>{p.name}</button>)}
            </div>
          </div>}
          <Inp value={addr} onChange={e=>sAddr(e.target.value)} placeholder={L.addrPlaceholder}/>
          {user&&!user.isAdmin&&user.addresses&&user.addresses.length>0&&<div style={{marginTop:"0.5rem",display:"flex",flexWrap:"wrap",gap:6}}>
            {user.addresses.map((a,i)=><button key={i} onClick={()=>sAddr(a)} style={{background:addr===a?T.accent+"22":"transparent",border:`1px solid ${addr===a?T.accent:T.border}`,borderRadius:8,padding:"5px 10px",fontSize:12,color:addr===a?T.accent:T.muted,cursor:"pointer"}}>{a}</button>)}
          </div>}
        </Crd>

        <Crd>
          <h4 style={{fontWeight:700,marginBottom:"0.6rem",fontFamily:ff,color:T.text}}>💳 {L.payment}</h4>

            <label key={k} style={{display:"flex",alignItems:"center",gap:9,padding:"8px 0",cursor:"pointer"}}>
              <input type="radio" checked={pay===k} onChange={()=>sPay(k)} style={{accentColor:T.accent,width:15,height:15}}/><span style={{fontSize:14,color:T.text}}>{lbl}</span>
            </label>
          )}
        </Crd>

        <Crd>
          <h3 style={{marginBottom:"1rem",fontWeight:800,fontFamily:ff,color:T.text}}>{L.total}</h3>
          <div style={{display:"grid",gap:7,marginBottom:"1rem"}}>
            {[[L.subtotal,sub],[L.delivery,del],promoOk?[`${L.discount} (FIRST20)`,-disc]:null].filter(Boolean).map(([k,v])=>
              <div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:14}}>
                <span style={{color:T.muted}}>{k}</span>
                <span style={{color:v<0?T.green:T.text,fontWeight:v<0?700:400}}>{v<0?"−":""}{Math.abs(v).toLocaleString()}₸</span>
              </div>
            )}
            <div style={{borderTop:`1px solid ${T.border}`,paddingTop:9,display:"flex",justifyContent:"space-between",fontWeight:800,fontSize:17}}>
              <span style={{color:T.text}}>{L.total}</span><span style={{color:T.accent}}>{total.toLocaleString()}₸</span>
            </div>
          </div>
          {!promoOk&&<div style={{display:"flex",gap:7,marginBottom:"0.65rem"}}>
            <Inp value={promo} onChange={e=>sPromo(e.target.value)} placeholder={L.promo} style={{flex:1}}
              onKeyDown={e=>{if(e.key==="Enter"){if(promo.toUpperCase()==="FIRST20")sPOk(true);else alert(L.promoErr);}}}/>
            <Btn v="ghost" onClick={()=>{if(promo.toUpperCase()==="FIRST20")sPOk(true);else alert(L.promoErr);}}>{L.apply}</Btn>
          </div>}
          {promoOk&&<div style={{color:T.green,fontSize:13,marginBottom:"0.65rem",padding:"8px 11px",background:T.green+"11",borderRadius:8}}>{L.promoOk}</div>}
          {err&&<div style={{color:T.red,fontSize:13,marginBottom:"0.65rem",padding:"8px 11px",background:T.red+"11",borderRadius:8}}>{err}</div>}
          <Btn full sz="lg" onClick={doCheckout}>{L.checkout} — {total.toLocaleString()}₸</Btn>
          <div style={{textAlign:"center",fontSize:12,color:T.muted,marginTop:8}}>{L.secure}</div>
        </Crd>
      </div>}
    </div>
  </div>;
}

    const ti=setInterval(()=>sEta(e=>Math.max(0,e-.5)),1000);

          t3=setTimeout(()=>sIdx(3),16000),t4=setTimeout(()=>sIdx(4),26000);

      <Crd style={{textAlign:"center",marginBottom:"1rem",background:idx===4?T.green+"11":T.card,borderColor:idx===4?T.green:T.border}}>
        <div style={{fontSize:44,marginBottom:"0.4rem"}}>{ois[idx]}</div>
        <h2 style={{fontSize:20,fontWeight:900,fontFamily:ff,margin:"0 0 0.4rem",color:T.text}}>{ols[idx]}</h2>
        {idx<4&&<div style={{fontSize:32,fontWeight:900,color:T.accent,fontFamily:ff}}>{Math.ceil(eta)} {L.min}<div style={{fontSize:12,fontWeight:400,color:T.muted,marginTop:3}}>{L.etaLabel}</div></div>}
      </Crd>
      <Crd style={{padding:0,overflow:"hidden",marginBottom:"1rem"}}>
        <div style={{padding:"0.8rem 1rem 0.4rem",display:"flex",justifyContent:"space-between",alignItems:"center"}}>

          <span style={{color:T.muted}}>🛵 {L.courierName}</span>
          <span style={{color:T.accent}}>★ 4.9 · 347</span>
        </div>
      </Crd>
      <Crd style={{marginBottom:"1rem"}}>
        <h4 style={{fontWeight:700,marginBottom:"0.65rem",fontFamily:ff,color:T.text}}>📞 Байланыс</h4>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <Btn v="green" onClick={()=>alert("📞 +7 777 123 45 67")} style={{flex:1}}>{L.callC}</Btn>

        </div>
        {showChat&&<div style={{marginTop:"0.75rem"}}>
          <div style={{background:T.cardHover,borderRadius:11,padding:"0.65rem",maxHeight:160,overflowY:"auto",marginBottom:"0.55rem",display:"flex",flexDirection:"column",gap:7}}>
            {chatH.map((m,i)=><div key={i} style={{display:"flex",justifyContent:m.from==="user"?"flex-end":"flex-start"}}>
              <div style={{background:m.from==="user"?T.accent:T.card,color:m.from==="user"?"#fff":T.text,borderRadius:9,padding:"6px 11px",fontSize:13,maxWidth:"75%"}}>{m.text}</div>
            </div>)}

          <div style={{display:"flex",gap:7}}>
            <Inp value={chatMsg} onChange={e=>sCM(e.target.value)} placeholder="Хабарлама..." style={{flex:1}} onKeyDown={e=>e.key==="Enter"&&sendMsg()}/>

      </Crd>
      <Crd>
        <h3 style={{marginBottom:"1rem",fontWeight:800,fontFamily:ff,color:T.text}}>📋 {L.trackOrder}</h3>

        <div style={{display:"grid",gap:"0.6rem"}}>
          <Inp value={name} onChange={e=>sName(e.target.value)} placeholder={L.name}/>
          <Inp value={phone} onChange={e=>sPhone(e.target.value)} placeholder={L.phone}/>
          <Inp value={user.email} onChange={()=>{}} placeholder={L.email}/>
          {saved&&<div style={{color:T.green,fontSize:13,padding:"8px 11px",background:T.green+"11",borderRadius:8}}>✅ Сақталды!</div>}
          <Btn full onClick={saveProfile}>{L.saveBtn}</Btn>
        </div>
      </Crd>}
      {tab==="orders"&&<div style={{display:"grid",gap:"0.6rem"}}>
        {(!user.orders||user.orders.length===0)
          ?<Crd style={{textAlign:"center",padding:"2rem"}}><div style={{fontSize:40,marginBottom:"0.7rem"}}>📦</div><p style={{color:T.muted}}>{L.noOrders}</p></Crd>
          :user.orders.map((o,i)=><Crd key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{fontWeight:700,marginBottom:3,fontFamily:ff,color:T.text}}>{o.id}</div>
              <div style={{color:T.muted,fontSize:13}}>{o.items}</div>
              <div style={{color:T.sub,fontSize:12}}>{o.date}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontWeight:800,color:T.accent}}>{o.total.toLocaleString()}₸</div>
              <Bdg color={T.green}>{o.status}</Bdg>
            </div>
          </Crd>)
        }
      </div>}
      {tab==="addresses"&&<div style={{display:"grid",gap:"0.6rem"}}>
        {(user.addresses||[]).length===0&&<Crd style={{textAlign:"center",padding:"1.5rem"}}><p style={{color:T.muted}}>Мекенжай жоқ</p></Crd>}
        {(user.addresses||[]).map((a,i)=><Crd key={i} style={{padding:"0.9rem"}}>
          {editIdx===i
            ?<div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
              <Inp value={editVal} onChange={e=>sEditVal(e.target.value)} style={{flex:1}} onKeyDown={e=>e.key==="Enter"&&saveEdit()}/>
              <Btn onClick={saveEdit}>{L.saveBtn}</Btn>
              <Btn v="ghost" onClick={()=>sEditIdx(-1)}>{L.cancelR}</Btn>
            </div>
            :<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <div style={{color:T.text,fontSize:14,flex:1}}>📍 {a}</div>
              <div style={{display:"flex",gap:6,flexShrink:0}}>
                <Btn sz="sm" v="ghost" onClick={()=>startEdit(i,a)}>{L.editAddr}</Btn>
                <Btn sz="sm" v="danger" onClick={()=>delAddr(i)}>{L.delAddr}</Btn>
              </div>
            </div>}
        </Crd>)}
        <div style={{display:"flex",gap:7}}>
          <Inp value={newAddr} onChange={e=>sNewAddr(e.target.value)} placeholder={L.addrPlaceholder} style={{flex:1}} onKeyDown={e=>e.key==="Enter"&&addAddr()}/>
          <Btn onClick={addAddr}>{L.addAddr}</Btn>
        </div>
      </div>}
      {tab==="favorites"&&<div>
        {favRestaurants.length===0
          ?<Crd style={{textAlign:"center",padding:"2.5rem"}}>
            <div style={{fontSize:48,marginBottom:"0.8rem"}}>🤍</div>
            <h3 style={{color:T.text,fontFamily:ff,marginBottom:"0.5rem"}}>{L.noFav}</h3>
            <p style={{color:T.muted,fontSize:13}}>Мейрамхана бетінде ❤️ батырмасын басыңыз</p>
            <div style={{marginTop:"1rem"}}><Btn onClick={()=>nav("home")}>← Мейрамханаларға өту</Btn></div>
          </Crd>
          :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:"0.9rem"}}>
            {favRestaurants.map(r=>(
              <Crd key={r.id} style={{overflow:"hidden",padding:0}}>
                <div style={{height:120,position:"relative",overflow:"hidden"}}>
                  <img src={r.img} alt={r.name} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}
                    onError={e=>{e.target.src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&q=80";}}/>
                  <div style={{position:"absolute",inset:0,background:"linear-gradient(to top,rgba(0,0,0,0.45),transparent 55%)"}}/>
                  <button onClick={()=>toggleFav(r.id)} style={{position:"absolute",top:8,right:8,background:"rgba(0,0,0,0.5)",border:"none",borderRadius:7,padding:"4px 8px",fontSize:16,cursor:"pointer",color:"#fff"}}>❤️</button>
                  <div style={{position:"absolute",bottom:7,left:9,fontSize:20}}>{r.emoji}</div>
                </div>
                <div style={{padding:"0.75rem"}}>
                  <div style={{fontWeight:800,fontSize:14,fontFamily:ff,color:T.text,marginBottom:3}}>{r.name}</div>
                  <div style={{display:"flex",gap:8,fontSize:12,color:T.muted,marginBottom:8}}>
                    <span>★ {r.rating}</span><span>⏱ {r.time} мин</span>
                  </div>
                  <Btn full sz="sm" onClick={()=>nav("restaurant",r)}>Менюді ашу →</Btn>
                </div>
              </Crd>
            ))}
          </div>
        }
      </div>}
    </div>
  </div>;
}

/* ══ ADMIN ══ */
function AdminPage({nav,user,restaurants,setRestaurants,doLogout}){
  const{dark,L}=useApp();const T=getT(dark);
  const ff="'Syne',sans-serif";

  if(!user?.isAdmin)return <div style={{minHeight:"100vh",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
    <Crd style={{textAlign:"center",padding:"2rem",maxWidth:320}}>
      <div style={{fontSize:44,marginBottom:"0.8rem"}}>🔒</div>
      <h3 style={{color:T.text,fontFamily:ff,marginBottom:"0.8rem"}}>Рұқсат жоқ</h3>
      <Btn full onClick={()=>nav("admin-login")}>Әкімші ретінде кіру</Btn>
    </Crd>
  </div>;

  const[tab,sTab]=useState("dashboard");
  const[showModal,sShowModal]=useState(false);
  const[editRest,sEditRest]=useState(null);
  const[rForm,sRForm]=useState({name:"",cat:"burgers",img:"",time:"20-30",emoji:"🍽️",free:true,fee:0,rating:4.5,tags:[]});
  const[formErr,sFormErr]=useState("");

  const[liveOrders,setLiveOrders]=useState(()=>lsGet(ORDERS_KEY,[]));
  useEffect(()=>{const interval=setInterval(()=>setLiveOrders(lsGet(ORDERS_KEY,[])),3000);return()=>clearInterval(interval);},[]);

  const[liveCouriers,setLiveCouriers]=useState(()=>lsGet(COURIERS_KEY,INIT_COURIERS));
  useEffect(()=>{const interval=setInterval(()=>setLiveCouriers(lsGet(COURIERS_KEY,INIT_COURIERS)),3000);return()=>clearInterval(interval);},[]);

  const totalRevenue=liveOrders.reduce((a,o)=>a+(o.total||0),0);
  const onlineCouriers=liveCouriers.filter(c=>c.status==="🟢").length;

  const openAdd=()=>{sEditRest(null);sRForm({name:"",cat:"burgers",img:"",time:"20-30",emoji:"🍽️",free:true,fee:0,rating:4.5,tags:[]});sFormErr("");sShowModal(true);};
  const openEdit=r=>{sEditRest(r);sRForm({name:r.name||"",cat:r.cat||"burgers",img:r.img||"",time:r.time||"20-30",emoji:r.emoji||"🍽️",free:r.free!==false,fee:r.fee||0,rating:r.rating||4.5,tags:r.tags||[]});sFormErr("");sShowModal(true);};
  const saveRest=()=>{
    sFormErr("");
    if(!rForm.name.trim()){sFormErr("Мейрамхана атауын енгізіңіз");return;}
    if(editRest)setRestaurants(restaurants.map(r=>r.id===editRest.id?{...r,...rForm}:r));
    else setRestaurants([...restaurants,{id:Date.now(),cnt:0,disc:null,...rForm,img:rForm.img.trim()||"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600&q=80"}]);
    sShowModal(false);
  };
  const delRest=id=>{if(window.confirm("Жоюды растайсыз ба?"))setRestaurants(restaurants.filter(r=>r.id!==id));};

  const tabs=[["dashboard",`📊 ${L.dashboard}`],["orders",`📦 ${L.ordersT}${liveOrders.length>0?` (${liveOrders.length})`:""}`],["restaurants",`🍽️ ${L.restaurantsT}`],["couriers",`🛵 ${L.couriers}`]];

  return <div style={{minHeight:"100vh",background:T.bg,color:T.text}}>
    {showModal&&<Modal title={editRest?"✏️ Мейрамхана өзгерту":L.addRest} onClose={()=>sShowModal(false)}>
      <div style={{display:"grid",gap:"0.65rem"}}>
        <div><div style={{fontSize:12,color:T.muted,marginBottom:4}}>{L.restName} *</div>
          <Inp placeholder={L.restName} value={rForm.name} onChange={e=>sRForm(f=>({...f,name:e.target.value}))}/></div>
        <div><div style={{fontSize:12,color:T.muted,marginBottom:4}}>{L.restCat}</div>
          <Sel value={rForm.cat} onChange={e=>sRForm(f=>({...f,cat:e.target.value}))}>
            {CATS.filter(c=>c!=="all").map(c=><option key={c} value={c}>{L[CAT_KEYS[c]]}</option>)}
          </Sel></div>
        <div><div style={{fontSize:12,color:T.muted,marginBottom:4}}>{L.restImg}</div>
          <Inp placeholder="https://..." value={rForm.img} onChange={e=>sRForm(f=>({...f,img:e.target.value}))}/></div>
        <div><div style={{fontSize:12,color:T.muted,marginBottom:4}}>{L.restTime}</div>
          <Inp placeholder="20-30" value={rForm.time} onChange={e=>sRForm(f=>({...f,time:e.target.value}))}/></div>
        <div><div style={{fontSize:12,color:T.muted,marginBottom:4}}>Emoji</div>
          <Inp placeholder="🍕" value={rForm.emoji} onChange={e=>sRForm(f=>({...f,emoji:e.target.value}))}/></div>
        <div style={{display:"flex",gap:12,alignItems:"center"}}>
          <label style={{display:"flex",alignItems:"center",gap:7,cursor:"pointer"}}>
            <input type="checkbox" checked={rForm.free} onChange={e=>sRForm(f=>({...f,free:e.target.checked}))} style={{accentColor:T.accent,width:15,height:15}}/>
            <span style={{fontSize:14,color:T.text}}>Тегін жеткізу</span>
          </label>
          {!rForm.free&&<div style={{display:"flex",alignItems:"center",gap:7}}>
            <span style={{fontSize:13,color:T.muted}}>Баға:</span>
            <input type="number" value={rForm.fee} onChange={e=>sRForm(f=>({...f,fee:Number(e.target.value)}))}
              style={{width:80,background:T.inp,border:`1px solid ${T.border}`,borderRadius:8,padding:"7px 10px",fontSize:13,color:T.text,outline:"none"}}/>
            <span style={{fontSize:13,color:T.muted}}>₸</span>
          </div>}
        </div>
        {formErr&&<div style={{color:T.red,fontSize:13,padding:"8px 11px",background:T.red+"11",borderRadius:8}}>{formErr}</div>}
        <div style={{display:"flex",gap:8,marginTop:"0.5rem"}}>
          <Btn full onClick={saveRest}>{L.saveRest}</Btn>
          <Btn v="ghost" full onClick={()=>sShowModal(false)}>{L.cancelR}</Btn>
        </div>
      </div>
    </Modal>}

    <nav style={{position:"sticky",top:0,zIndex:100,background:T.nav,backdropFilter:"blur(20px)",borderBottom:`1px solid ${T.border}`,padding:"0 1rem"}}>
      <div style={{maxWidth:1200,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:56,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <Btn v="ghost" sz="sm" onClick={()=>nav("home")}>← {L.home}</Btn>
          <span style={{fontSize:15,fontWeight:800,fontFamily:ff}}>⚙️ {L.adminPanel}</span>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <span style={{fontSize:11,color:T.green}}>● Live</span>
          <Bdg color={T.green}>Admin v2.0</Bdg>
          <Btn v="danger" sz="sm" onClick={doLogout}>↩ {L.logout}</Btn>
        </div>
      </div>
    </nav>

    <div style={{maxWidth:1200,margin:"0 auto",padding:"1.25rem 1rem 3rem"}} className="fade-in">
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(170px,1fr))",gap:"0.7rem",marginBottom:"1.25rem"}}>
        {[
          ["📦 "+L.orders,String(liveOrders.length),`+${liveOrders.length}`,T.accent],
          ["💰 Табыс",`${totalRevenue.toLocaleString()}₸`,"+8%",T.green],
          ["🛵 "+L.couriers,String(liveCouriers.length),"Барлығы",T.blue],
          ["🟢 Онлайн",String(onlineCouriers),"Жұмыста",T.green]
        ].map(([lbl,v,c,col])=>
          <Crd key={lbl} style={{padding:"0.8rem"}}>
            <div style={{fontSize:19,fontWeight:900,color:col,marginBottom:2,fontFamily:ff}}>{v}</div>
            <div style={{color:T.muted,fontSize:12}}>{lbl}</div>
            <div style={{fontSize:11,color:T.sub,marginTop:2}}>{c}</div>
          </Crd>
        )}
      </div>

      <div style={{display:"flex",gap:"0.4rem",marginBottom:"1.1rem",flexWrap:"wrap"}}>
        {tabs.map(([k,lbl])=><button key={k} onClick={()=>sTab(k)} style={{background:tab===k?T.accent:T.card,color:tab===k?"#fff":T.muted,border:`1px solid ${tab===k?T.accent:T.border}`,borderRadius:9,padding:"7px 13px",fontSize:13,fontWeight:600,cursor:"pointer",outline:"none",whiteSpace:"nowrap",transition:"all 0.18s"}}>{lbl}</button>)}
      </div>

      {tab==="dashboard"&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(270px,1fr))",gap:"1.1rem"}}>
        <Crd>
          <h4 style={{fontWeight:700,marginBottom:"0.65rem",fontFamily:ff,color:T.text}}>📈 {L.salesChart}</h4>
          <div style={{display:"flex",alignItems:"flex-end",gap:4,height:85}}>
            {[30,45,62,80,95,110,85,70,90,122,100,72].map((h,i)=><div key={i} style={{flex:1,height:`${h/1.22}%`,background:i===9?T.accent:T.accent+"44",borderRadius:3}}/>)}
          </div>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:T.sub,marginTop:4}}>
            <span>9:00</span><span>12:00</span><span>15:00</span><span>18:00</span><span>21:00</span>
          </div>
        </Crd>
        <Crd>
          <h4 style={{fontWeight:700,marginBottom:"0.65rem",fontFamily:ff,color:T.text}}>🍽️ {L.topRest}</h4>
          {restaurants.slice(0,5).map((r,i)=><div key={r.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:9}}>
            <span style={{fontSize:14,minWidth:20}}>{["🥇","🥈","🥉","4️⃣","5️⃣"][i]}</span>
            <span style={{flex:1,fontSize:13,color:T.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</span>
            <div style={{height:5,width:70,background:T.border,borderRadius:3,overflow:"hidden",flexShrink:0}}>
              <div style={{height:"100%",width:`${100-i*18}%`,background:T.accent,borderRadius:3}}/>
            </div>
          </div>)}
        </Crd>
        {liveOrders.length>0&&<Crd>
          <h4 style={{fontWeight:700,marginBottom:"0.65rem",fontFamily:ff,color:T.text}}>🆕 Жаңа тапсырыстар</h4>
          {liveOrders.slice(0,4).map((o,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:`1px solid ${T.border}`,fontSize:13}}>
            <div>
              <div style={{fontWeight:600,color:T.accent}}>{o.id}</div>
              <div style={{color:T.muted,fontSize:11}}>{o.client} · {o.restaurant}</div>
            </div>
            <div style={{color:T.text,fontWeight:700}}>{(o.total||0).toLocaleString()}₸</div>
          </div>)}
        </Crd>}
      </div>}

      {tab==="orders"&&<Crd>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"0.9rem",flexWrap:"wrap",gap:8}}>
          <h3 style={{fontWeight:800,fontFamily:ff,color:T.text}}>{L.latestOrders}</h3>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontSize:12,color:T.green}}>● Автожаңарту</span>
            <Bdg color={T.accent}>{liveOrders.length} тапсырыс</Bdg>
          </div>
        </div>
        {liveOrders.length===0
          ?<div style={{textAlign:"center",padding:"3rem",color:T.muted}}>
            <div style={{fontSize:44,marginBottom:"0.7rem"}}>📋</div>
            <p>Тапсырыстар жоқ. Клиент тапсырыс берген кезде мұнда көрсетіледі.</p>
          </div>
          :<div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:500}}>
              <thead><tr style={{borderBottom:`1px solid ${T.border}`}}>
                {["ID","Клиент","Мейрамхана","Тауарлар","Сома","Уақыт"].map(h=><th key={h} style={{padding:"8px 10px",color:T.muted,textAlign:"left",fontWeight:600,whiteSpace:"nowrap"}}>{h}</th>)}
              </tr></thead>
              <tbody>
                {liveOrders.map((o,ri)=><tr key={ri} style={{borderBottom:`1px solid ${T.border}`}}>
                  <td style={{padding:"9px 10px",color:T.accent,whiteSpace:"nowrap",fontWeight:700}}>{o.id}</td>
                  <td style={{padding:"9px 10px",color:T.text,whiteSpace:"nowrap"}}>{o.client}</td>
                  <td style={{padding:"9px 10px",color:T.text,whiteSpace:"nowrap"}}>{o.restaurant}</td>
                  <td style={{padding:"9px 10px",color:T.muted,maxWidth:200,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.items}</td>
                  <td style={{padding:"9px 10px",color:T.text,fontWeight:700,whiteSpace:"nowrap"}}>{(o.total||0).toLocaleString()}₸</td>
                  <td style={{padding:"9px 10px",color:T.muted,whiteSpace:"nowrap"}}>{o.time}</td>
                </tr>)}
              </tbody>
            </table>
          </div>
        }
      </Crd>}

      {tab==="restaurants"&&<div style={{display:"grid",gap:"0.6rem"}}>
        <Btn full onClick={openAdd}>{L.addRest}</Btn>
        {restaurants.map(r=><Crd key={r.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:9,padding:"0.85rem"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:50,height:50,borderRadius:10,overflow:"hidden",flexShrink:0,background:T.cardHover,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>
              {r.img?<img src={r.img} alt={r.name} style={{width:"100%",height:"100%",objectFit:"cover"}} onError={e=>{e.target.style.display="none";}}/>
              :<span>{r.emoji||"🍽️"}</span>}
            </div>
            <div>
              <div style={{fontWeight:700,fontFamily:ff,color:T.text,fontSize:14}}>{r.emoji} {r.name}</div>
              <div style={{color:T.muted,fontSize:12}}>★ {r.rating} · {L[CAT_KEYS[r.cat]]} · {r.time} {L.min}</div>
              <div style={{color:T.muted,fontSize:12}}>🚚 {r.free?"Тегін":`${r.fee}₸`}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:7}}>
            <Btn v="ghost" sz="sm" onClick={()=>openEdit(r)}>{L.editR}</Btn>
            <Btn v="danger" sz="sm" onClick={()=>delRest(r.id)}>{L.delR}</Btn>
          </div>
        </Crd>)}
      </div>}

      {tab==="couriers"&&<div style={{display:"grid",gap:"0.6rem"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
          <span style={{fontSize:12,color:T.green}}>● 3 секунд сайын жаңарады</span>
        </div>
        {liveCouriers.map((c,i)=><Crd key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:9,padding:"0.85rem"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:42,height:42,borderRadius:"50%",background:T.accent+"22",border:`2px solid ${T.accent}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>🛵</div>
            <div>
              <div style={{fontWeight:700,fontFamily:ff,color:T.text,fontSize:14}}>{c.name}</div>
              <div style={{color:T.muted,fontSize:12}}>★ {c.rating} · {c.del} жеткізу</div>
              <div style={{color:T.blue,fontSize:12,cursor:"pointer"}} onClick={()=>alert(`📞 ${c.phone}`)}>{c.phone}</div>
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{marginBottom:4,fontSize:16}}>{c.status} <span style={{fontSize:12,color:T.muted}}>{c.statusText}</span></div>
            <div style={{color:T.accent,fontWeight:700,fontSize:15}}>{(c.earn||0).toLocaleString()}₸</div>
          </div>
        </Crd>)}
      </div>}
    </div>
  </div>;
}

/* ══ APP ROOT ══ */
function App(){
  const[dark,setDark]=useLS("ffg_dark",true);
  const[lang,setLang]=useLS("ffg_lang","ru");
  const[page,setPage]=useState("home");
  const[rest,setRest]=useState(null);
  const[cart,setCart]=useState(()=>lsGet("ffg_cart",{}));
  const[user,setUserState]=useState(()=>lsGet("ffg_user",null));
  const[restaurants,setRestaurantsState]=useState(()=>lsGet("ffg_restaurants",INIT_RESTAURANTS));
  const[toast,setToast]=useState(null);
  const T=getT(dark);
  const L=TR[lang]||TR.ru;

  useEffect(()=>{document.body.style.background=T.bg;document.body.style.color=T.text;},[dark]);

  const setRestaurants=useCallback(val=>{
    const newVal=typeof val==="function"?val(lsGet("ffg_restaurants",INIT_RESTAURANTS)):val;
    setRestaurantsState(newVal);lsSet("ffg_restaurants",newVal);
  },[]);

  const updateUser=useCallback(updated=>{
    setUserState(updated);lsSet("ffg_user",updated);
    const users=lsGet("ffg_users",[]);
    lsSet("ffg_users",users.map(u=>u.id===updated.id?updated:u));
  },[]);

  const onLogin=useCallback(u=>{setUserState(u);lsSet("ffg_user",u);},[]);
  const doLogout=useCallback(()=>{setUserState(null);lsSet("ffg_user",null);setPage("home");window.scrollTo(0,0);},[]);

  const addOrderToUser=useCallback(order=>{
    const currentUser=lsGet("ffg_user",null);
    if(!currentUser||currentUser.isAdmin)return;
    const updated={...currentUser,orders:[order,...(currentUser.orders||[])]};
    updateUser(updated);
  },[updateUser]);

  const nav=useCallback((p,data=null)=>{
    if(p==="restaurant"&&data)setRest(data);
    setPage(p);window.scrollTo(0,0);
  },[]);

  const addToast=useCallback(msg=>{setToast(msg);setTimeout(()=>setToast(null),2800);},[]);
  const cartCount=Object.keys(cart).filter(k=>k!=="_items").reduce((a,k)=>a+cart[k],0);

  return <ThemeCtx.Provider value={{dark,setDark,lang,setLang,L}}>
    {toast&&<Toast msg={toast} onClose={()=>setToast(null)}/>}
    {page==="home"&&<HomePage nav={nav} cart={cart} user={user} restaurants={restaurants} doLogout={doLogout}/>}
    {page==="restaurant"&&rest&&<RestaurantPage restaurant={rest} nav={nav} cart={cart} setCart={setCart} addToast={addToast} user={user} updateUser={updateUser}/>}
    {page==="cart"&&<CartPage nav={nav} cart={cart} setCart={setCart} user={user} updateUser={updateUser} addOrderToUser={addOrderToUser}/>}
    {page==="tracking"&&<TrackingPage nav={nav}/>}
    {page==="account"&&<AccountPage nav={nav} user={user} updateUser={updateUser} doLogout={doLogout} restaurants={restaurants}/>}
    {page==="login"&&<AuthPage nav={nav} onLogin={onLogin} initMode="login"/>}
    {page==="register"&&<AuthPage nav={nav} onLogin={onLogin} initMode="register"/>}
    {page==="admin-login"&&<AdminLoginPage nav={nav} onLogin={onLogin}/>}
    {page==="admin"&&<AdminPage nav={nav} user={user} restaurants={restaurants} setRestaurants={setRestaurants} doLogout={doLogout}/>}
  </ThemeCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
